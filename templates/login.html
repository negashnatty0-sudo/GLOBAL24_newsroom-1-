<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GLOBAL24 — Admin Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;

            background: linear-gradient(135deg, #07111f, #1c2b42);
            font-family: system-ui, sans-serif;
            color: #fff;
        }
        .box {
            width: 100%;
            max-width: 380px;
            background: #fff;
            color: #172033;
            padding: 32px 28px;
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0,0,0,.4);
        }
        h1 { margin: 0 0 6px; font-size: 26px; }
        h1 span { color: #d4af37; }
        p.sub { margin: 0 0 22px; color: #64748b; font-size: 14px; }
        label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }

            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d5dbe3;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 16px;
            outline: none;
        }
        input:focus { border-color: #d4af37; }
        button {

            padding: 13px;
            background: #07111f;
