<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOBAL24 — Admin Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: #f1f5f9;
            color: #172033;
        }
        header {
            background: #07111f;
            color: #fff;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 { margin: 0; font-size: 22px; }
        header h1 span { color: #d4af37; }
        header button {
            background: #d4af37;
            color: #07111f;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 20px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }
        .stat {
            background: #fff;
            padding: 18px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,.06);
        }
        .stat .num { font-size: 30px; font-weight: 900; color: #07111f; }
        .stat .label { color: #64748b; font-size: 13px; margin-top: 4px; }
        .card {
            background: #fff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,.06);
            margin-bottom: 24px;
        }
        .card h2 { margin: 0 0 18px; font-size: 20px; }
        label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; margin-top: 14px; }
        input[type=text], input[type=file], textarea, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d5dbe3;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
        }
        input:focus, textarea:focus, select:focus { border-color: #d4af37; }
        textarea { min-height: 120px; resize: vertical; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 14px;
        }
        .checkbox-row input { width: auto; }
        .btn {
            background: #07111f;
            color: #d4af37;
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            margin-top: 20px;
        }
        .btn:hover { background: #1c2b42; }
        .btn:disabled { opacity: .6; cursor: not-allowed; }
        .preview {
            margin-top: 12px;
            max-width: 260px;
            border-radius: 8px;
            display: none;
        }
        .msg {
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 16px;
            font-size: 14px;
            display: none;
        }
        .msg.ok { background: #dcfce7; color: #166534; display: block; }
        .msg.err { background: #fee2e2; color: #991b1b; display: block; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }
        th, td {
            text-align: left;
            padding: 10px 8px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }
        th { background: #f8fafc; font-size: 12px; text-transform: uppercase; color: #64748b; }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
        }
        .badge.pub { background: #dcfce7; color: #166534; }
        .badge.draft { background: #fef3c7; color: #854d0e; }
        .del {
            background: #fee2e2;
            color: #991b1b;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
        }
    </style>
</head>
<body>

<header>
    <h1>GLOBAL<span>24</span> Admin</h1>
    <button id="logoutBtn">Log out</button>
</header>

<div class="container">

    <div class="stats" id="stats">
        <div class="stat"><div class="num" id="statTotal">–</div><div class="label">Total</div></div>
        <div class="stat"><div class="num" id="statPublished">–</div><div class="label">Published</div></div>
        <div class="stat"><div class="num" id="statDrafts">–</div><div class="label">Drafts</div></div>
        <div class="stat"><div class="num" id="statBreaking">–</div><div class="label">Breaking</div></div>
    </div>

    <div class="card">
        <h2>Publish new article</h2>

        <form id="articleForm">

            <label for="headline">Headline *</label>
            <input type="text" id="headline" required>

            <div class="row">
                <div>
                    <label for="category">Category</label>
                    <select id="category">
                        <option>World</option>
                        <option>Africa</option>
                        <option>Ethiopia</option>
                        <option>Politics</option>
                        <option>Business</option>
                        <option>Technology</option>
                        <option>Sports</option>
                        <option>Health</option>
                    </select>
                </div>
                <div>
                    <label for="author">Author</label>
                    <input type="text" id="author" value="GLOBAL24">
                </div>
            </div>

            <label for="imageFile">Image (jpg, png, webp, gif)</label>
            <input type="file" id="imageFile" accept="image/*">
            <img id="imagePreview" class="preview" alt="Preview">

            <label for="videoFile">Video (mp4, webm, mov — optional)</label>
            <input type="file" id="videoFile" accept="video/*">

            <label for="summary">Summary</label>
            <textarea id="summary" style="min-height:80px;"></textarea>

            <label for="content">Article content *</label>
            <textarea id="content" required></textarea>

            <div class="checkbox-row">
                <input type="checkbox" id="breaking">
                <label for="breaking" style="margin:0;">Mark as breaking news</label>
            </div>

            <label for="status">Status</label>
            <select id="status">
                <option value="Draft">Draft</option>
                <option value="Published">Published</option>
            </select>

            <button type="submit" class="btn" id="submitBtn">Publish article</button>

            <div class="msg" id="formMsg"></div>
        </form>
    </div>

    <div class="card">
        <h2>All articles</h2>
        <table>
            <thead>
                <tr>
                    <th>Headline</th>
                    <th>Category</th>
                    <th>Status</th>
                    <th>Date</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="articleRows">
                <tr><td colspan="5">Loading…</td></tr>
            </tbody>
        </table>
    </div>

</div>

<script>
// =========================================================
// HELPERS
// =========================================================

function showMsg(text, ok = true) {
    const box = document.getElementById("formMsg");
    box.textContent = text;
    box.className = "msg " + (ok ? "ok" : "err");
}

function hideMsg() {
    document.getElementById("formMsg").className = "msg";
}

// =========================================================
// IMAGE PREVIEW
// =========================================================

document.getElementById("imageFile").addEventListener("change", function () {
    const file = this.files[0];
    const preview = document.getElementById("imagePreview");

    if (!file) {
        preview.style.display = "none";
        return;
    }

    const reader = new FileReader();
    reader.onload = e => {
        preview.src = e.target.result;
        preview.style.display = "block";
    };
    reader.readAsDataURL(file);
});

// =========================================================
// UPLOAD FILE TO CLOUDINARY VIA BACKEND
// =========================================================

async function uploadFile(file) {
    const fd = new FormData();
    fd.append("file", file);

    const res = await fetch("/api/admin/upload", {
        method: "POST",
        body: fd
    });

    const data = await res.json();

    if (!data.success) {
        throw new Error(data.error || "Upload failed");
    }

    return data.url;
}

// =========================================================
// SUBMIT ARTICLE
// =========================================================

document.getElementById("articleForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    hideMsg();

    const submitBtn = document.getElementById("submitBtn");
    submitBtn.disabled = true;
    submitBtn.textContent = "Publishing…";

    try {
        let imageUrl = "";
        let videoUrl = "";

        const imageFile = document.getElementById("imageFile").files[0];
        const videoFile = document.getElementById("videoFile").files[0];

        if (imageFile) {
            showMsg("Uploading image…", true);
            imageUrl = await uploadFile(imageFile);
        }

        if (videoFile) {
            showMsg("Uploading video…", true);
            videoUrl = await uploadFile(videoFile);
        }

        const payload = {
            headline: document.getElementById("headline").value.trim(),
            category: document.getElementById("category").value,
            author: document.getElementById("author").value.trim() || "GLOBAL24",
            image: imageUrl,
            video: videoUrl,
            summary: document.getElementById("summary").value.trim(),
            content: document.getElementById("content").value.trim(),
            breaking: document.getElementById("breaking").checked,
            status: document.getElementById("status").value
        };

        const res = await fetch("/api/admin/articles", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!data.success) {
            throw new Error(data.error || "Could not save article.");
        }

        showMsg("Article saved successfully.", true);

        this.reset();
        document.getElementById("imagePreview").style.display = "none";

        loadStats();
        loadArticles();

    } catch (err) {
        showMsg(err.message, false);
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Publish article";
    }
});

// =========================================================
// LOAD STATS
// =========================================================

async function loadStats() {
    try {
        const res = await fetch("/api/admin/stats");
        const data = await res.json();

        if (!data.success) return;

        document.getElementById("statTotal").textContent = data.total;
        document.getElementById("statPublished").textContent = data.published;
        document.getElementById("statDrafts").textContent = data.drafts;
        document.getElementById("statBreaking").textContent = data.breaking;
    } catch (err) {
        console.error(err);
    }
}

// =========================================================
// LOAD ARTICLES
// =========================================================

async function loadArticles() {
    const tbody = document.getElementById("articleRows");

    try {
        const res = await fetch("/api/admin/articles");
        const data = await res.json();

        if (!data.success) {
            tbody.innerHTML = "<tr><td colspan='5'>Could not load articles.</td></tr>";
            return;
        }

        if (!data.articles.length) {
            tbody.innerHTML = "<tr><td colspan='5'>No articles yet.</td></tr>";
            return;
        }

        tbody.innerHTML = data.articles.map(a => {
            const badge = a.status === "Published"
                ? "<span class='badge pub'>Published</span>"
                : "<span class='badge draft'>Draft</span>";

            const date = a.created_at
                ? new Date(a.created_at).toLocaleDateString("en-GB")
                : "";

            return `
                <tr>
                    <td>${escapeHTML(a.headline)}</td>
                    <td>${escapeHTML(a.category || "")}</td>
                    <td>${badge}</td>
                    <td>${date}</td>
                    <td>
                        <button class="del" data-id="${a.id}">Delete</button>
                    </td>
                </tr>
            `;
        }).join("");

        tbody.querySelectorAll(".del").forEach(btn => {
            btn.addEventListener("click", () => deleteArticle(btn.dataset.id));
        });

    } catch (err) {
        tbody.innerHTML = "<tr><td colspan='5'>Error loading articles.</td></tr>";
    }
}

// =========================================================
// DELETE ARTICLE
// =========================================================

async function deleteArticle(id) {
    if (!confirm("Delete this article?")) return;

    try {
        const res = await fetch("/api/admin/articles/" + id, {
            method: "DELETE"
        });
        const data = await res.json();

        if (!data.success) {
            alert(data.error || "Delete failed.");
            return;
        }

        loadStats();
        loadArticles();

    } catch (err) {
        alert("Network error.");
    }
}

// =========================================================
// ESCAPE HTML
// =========================================================

function escapeHTML(text) {
    if (text == null) return "";
    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

// =========================================================
// LOGOUT
// =========================================================

document.getElementById("logoutBtn").addEventListener("click", async () => {
    await fetch("/api/logout", { method: "POST" });
    window.location.href = "/login";
});

// =========================================================
// START
// =========================================================

loadStats();
loadArticles();
</script>

</body>
</html>
