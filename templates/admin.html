<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GLOBAL24 — Admin Dashboard</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <style>
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .form-group {
            margin-bottom: 5px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 700;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d5dbe3;
            border-radius: 7px;
            outline: none;
        }

        .form-group textarea {
            min-height: 140px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #d8ad45;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-top: 5px;
        }

        .checkbox-row input {
            width: auto;
        }

        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .message {
            display: none;
            padding: 12px;
            margin-top: 15px;
            border-radius: 7px;
        }

        .success-message {
            background: #dcfce7;
            color: #166534;
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
        }

        .article-table-wrapper {
            overflow-x: auto;
        }

        .action-button {
            border: none;
            border-radius: 6px;
            padding: 7px 10px;
            cursor: pointer;
            font-weight: 700;
            margin-right: 5px;
        }

        .edit-button {
            background: #e0e7ff;
            color: #3730a3;
        }

        .delete-button {
            background: #fee2e2;
            color: #991b1b;
        }

        .breaking-badge {
            color: #c62828;
            font-weight: 800;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }

            .admin-header {
                align-items: flex-start;
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

<div class="admin-layout">

    <!-- SIDEBAR -->

    <aside class="admin-sidebar">

        <div class="logo">
            GLOBAL<span>24</span>
        </div>

        <nav class="admin-nav">

            <a
                href="#"
                class="active"
                onclick="showSection('dashboard')"
            >
                Dashboard
            </a>

            <a
                href="#"
                onclick="showSection('create')"
            >
                + Create News
            </a>

            <a
                href="#"
                onclick="showSection('articles')"
            >
                Articles
            </a>

            <a href="/" target="_blank">
                View Website
            </a>

            <a
                href="#"
                onclick="logout()"
            >
                Logout
            </a>

        </nav>

    </aside>


    <!-- MAIN -->

    <main class="admin-main">

        <!-- DASHBOARD -->

        <section id="dashboard">

            <div class="admin-header">

                <div>
                    <h1>GLOBAL24 Admin</h1>

                    <p style="color:#64748b;">
                        News management dashboard
                    </p>
                </div>

                <strong id="adminUsername">
                    Administrator
                </strong>

            </div>


            <div class="dashboard-stats">

                <div class="dashboard-card">
                    <small>Total Articles</small>
                    <strong id="totalArticles">0</strong>
                </div>

                <div class="dashboard-card">
                    <small>Published</small>
                    <strong id="publishedArticles">0</strong>
                </div>

                <div class="dashboard-card">
                    <small>Drafts</small>
                    <strong id="draftArticles">0</strong>
                </div>

                <div class="dashboard-card">
                    <small>Breaking News</small>
                    <strong id="breakingArticles">0</strong>
                </div>

            </div>


            <div class="admin-panel">

                <h2>Quick Actions</h2>

                <button
                    class="btn btn-primary"
                    onclick="showSection('create')"
                >
                    Create News Article
                </button>

                <button
                    class="btn btn-dark"
                    onclick="showSection('articles')"
                >
                    Manage Articles
                </button>

            </div>

        </section>


        <!-- CREATE / EDIT -->

        <section
            id="create"
            style="display:none;"
        >

            <div class="admin-panel">

                <h2 id="formTitle">
                    Create News Article
                </h2>

                <form id="articleForm">

                    <input
                        type="hidden"
                        id="articleId"
                    >


                    <div class="form-grid">

                        <div class="form-group full-width">

                            <label for="headline">
                                Headline
                            </label>

                            <input
                                type="text"
                                id="headline"
                                placeholder="Enter headline"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="category">
                                Category
                            </label>

                            <select
                                id="category"
                                required
                            >

                                <option value="">
                                    Select category
                                </option>

                                <option value="World">
                                    World
                                </option>

                                <option value="Africa">
                                    Africa
                                </option>

                                <option value="Ethiopia">
                                    Ethiopia
                                </option>

                                <option value="Politics">
                                    Politics
                                </option>

                                <option value="Business">
                                    Business
                                </option>

                                <option value="Technology">
                                    Technology
                                </option>

                                <option value="Sports">
                                    Sports
                                </option>

                                <option value="Health">
                                    Health
                                </option>

                                <option value="Science">
                                    Science
                                </option>

                                <option value="Culture">
                                    Culture
                                </option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label for="author">
                                Author
                            </label>

                            <input
                                type="text"
                                id="author"
                                value="GLOBAL24"
                                placeholder="Author"
                            >

                        </div>


                        <div class="form-group full-width">

                            <label for="image">
                                Image URL
                            </label>

                            <input
                                type="url"
                                id="image"
                                placeholder="https://example.com/image.jpg"
                            >

                        </div>


                        <div class="form-group full-width">

                            <label for="summary">
                                Article Summary
                            </label>

                            <textarea
                                id="summary"
                                placeholder="Short summary..."
                            ></textarea>

                        </div>


                        <div class="form-group full-width">

                            <label for="content">
                                Article Content
                            </label>

                            <textarea
                                id="content"
                                placeholder="Write the full article..."
                                required
                            ></textarea>

                        </div>


                        <div class="form-group">

                            <label for="status">
                                Status
                            </label>

                            <select id="status">

                                <option value="Published">
                                    Published
                                </option>

                                <option value="Draft">
                                    Draft
                                </option>

                            </select>

                        </div>


                        <div class="form-group">

                            <div class="checkbox-row">

                                <input
                                    type="checkbox"
                                    id="breaking"
                                >

                                <label for="breaking">
                                    Breaking News
                                </label>

                            </div>

                        </div>

                    </div>


                    <div class="button-row">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Publish / Save
                        </button>

                        <button
                            type="button"
                            class="btn btn-dark"
                            onclick="resetForm()"
                        >
                            Clear
                        </button>

                    </div>


                    <div
                        id="formMessage"
                        class="message"
                    ></div>

                </form>

            </div>

        </section>


        <!-- ARTICLES -->

        <section
            id="articles"
            style="display:none;"
        >

            <div class="admin-panel">

                <h2>Manage Articles</h2>

                <div class="article-table-wrapper">

                    <table class="admin-table">

                        <thead>

                            <tr>

                                <th>Headline</th>
                                <th>Category</th>
                                <th>Status</th>
                                <th>Breaking</th>
                                <th>Actions</th>

                            </tr>

                        </thead>

                        <tbody id="articleTable">

                        </tbody>

                    </table>

                </div>

            </div>

        </section>

    </main>

</div>


<script>

    let articles = [];


    // ==========================================
    // CHECK LOGIN
    // ==========================================

    async function checkLogin() {

        try {

            const response =
                await fetch("/api/me");

            const data =
                await response.json();

            if (!data.logged_in) {

                window.location.href =
                    "/login";

                return;

            }

            document.getElementById(
                "adminUsername"
            ).textContent =
                data.username;

            loadStats();

            loadArticles();

        }

        catch (error) {

            window.location.href =
                "/login";

        }

    }


    // ==========================================
    // SHOW SECTION
    // ==========================================

    function showSection(section) {

        document.getElementById(
            "dashboard"
        ).style.display =
            section === "dashboard"
                ? "block"
                : "none";


        document.getElementById(
            "create"
        ).style.display =
            section === "create"
                ? "block"
                : "none";


        document.getElementById(
            "articles"
        ).style.display =
            section === "articles"
                ? "block"
                : "none";


        if (section === "articles") {
            loadArticles();
        }

    }


    // ==========================================
    // LOAD STATS
    // ==========================================

    async function loadStats() {

        const response =
            await fetch(
                "/api/admin/stats"
            );


        if (!response.ok) {
            return;
        }


        const data =
            await response.json();


        document.getElementById(
            "totalArticles"
        ).textContent =
            data.total || 0;


        document.getElementById(
            "publishedArticles"
        ).textContent =
            data.published || 0;


        document.getElementById(
            "draftArticles"
        ).textContent =
            data.drafts || 0;


        document.getElementById(
            "breakingArticles"
        ).textContent =
            data.breaking || 0;

    }


    // ==========================================
    // LOAD ARTICLES
    // ==========================================

    async function loadArticles() {

        const response =
            await fetch(
                "/api/admin/articles"
            );


        if (!response.ok) {
            return;
        }


        const data =
            await response.json();


        articles =
            data.articles || [];


        renderArticles();

    }


    // ==========================================
    // RENDER ARTICLES
    // ==========================================

    function renderArticles() {

        const table =
            document.getElementById(
                "articleTable"
            );


        if (!articles.length) {

            table.innerHTML = `

                <tr>

                    <td colspan="5">

                        No articles yet.

                    </td>

                </tr>

            `;

            return;

        }


        table.innerHTML =
            articles.map(
                article => `

                <tr>

                    <td>
                        ${escapeHTML(
                            article.headline
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            article.category || "-"
                        )}
                    </td>

                    <td>

                        <span
                            class="status ${
                                article.status === "Published"
                                    ? "status-published"
                                    : "status-draft"
                            }"
                        >
                            ${escapeHTML(
                                article.status
                            )}
                        </span>

                    </td>

                    <td>

                        ${
                            article.breaking
                                ? '<span class="breaking-badge">YES</span>'
                                : "No"
                        }

                    </td>

                    <td>

                        <button
                            class="action-button edit-button"
                            onclick="editArticle(${article.id})"
                        >
                            Edit
                        </button>

                        <button
                            class="action-button delete-button"
                            onclick="deleteArticle(${article.id})"
                        >
                            Delete
                        </button>

                    </td>

                </tr>

            `
            ).join("");

    }


    // ==========================================
    // CREATE / UPDATE ARTICLE
    // ==========================================

    document
        .getElementById("articleForm")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const articleId =
                    document.getElementById(
                        "articleId"
                    ).value;


                const article = {

                    headline:
                        document.getElementById(
                            "headline"
                        ).value.trim(),

                    category:
                        document.getElementById(
                            "category"
                        ).value,

                    author:
                        document.getElementById(
                            "author"
                        ).value.trim() ||
                        "GLOBAL24",

                    image:
                        document.getElementById(
                            "image"
                        ).value.trim(),

                    summary:
                        document.getElementById(
                            "summary"
                        ).value.trim(),

                    content:
                        document.getElementById(
                            "content"
                        ).value.trim(),

                    breaking:
                        document.getElementById(
                            "breaking"
                        ).checked,

                    status:
                        document.getElementById(
                            "status"
                        ).value

                };


                const url =
                    articleId
                        ? `/api/admin/articles/${articleId}`
                        : "/api/admin/articles";


                const method =
                    articleId
                        ? "PUT"
                        : "POST";


                try {

                    const response =
                        await fetch(
                            url,
                            {
                                method: method,

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(
                                        article
                                    )
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        showMessage(
                            data.error ||
                            "Unable to save article.",
                            false
                        );

                        return;

                    }


                    showMessage(
                        articleId
                            ? "Article updated successfully."
                            : "Article published successfully.",
                        true
                    );


                    resetForm();

                    await loadStats();

                    await loadArticles();

                    showSection(
                        "articles"
                    );

                }

                catch (error) {

                    showMessage(
                        "Unable to connect to the server.",
                        false
                    );

                }

            }
        );


    // ==========================================
    // EDIT
    // ==========================================

    function editArticle(id) {

        const article =
            articles.find(
                item => item.id === id
            );


        if (!article) {
            return;
        }


        document.getElementById(
            "articleId"
        ).value =
            article.id;


        document.getElementById(
            "headline"
        ).value =
            article.headline || "";


        document.getElementById(
            "category"
        ).value =
            article.category || "";


        document.getElementById(
            "author"
        ).value =
            article.author || "GLOBAL24";


        document.getElementById(
            "image"
        ).value =
            article.image || "";


        document.getElementById(
            "summary"
        ).value =
            article.summary || "";


        document.getElementById(
            "content"
        ).value =
            article.content || "";


        document.getElementById(
            "status"
        ).value =
            article.status || "Draft";


        document.getElementById(
            "breaking"
        ).checked =
            Boolean(article.breaking);


        document.getElementById(
            "formTitle"
        ).textContent =
            "Edit News Article";


        showSection("create");

    }


    // ==========================================
    // DELETE
    // ==========================================

    async function deleteArticle(id) {

        if (
            !confirm(
                "Delete this article?"
            )
        ) {
            return;
        }


        try {

            const response =
                await fetch(
                    `/api/admin/articles/${id}`,
                    {
                        method: "DELETE"
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                alert(
                    data.error ||
                    "Unable to delete article."
                );

                return;

            }


            await loadStats();

            await loadArticles();

        }

        catch (error) {

            alert(
                "Unable to connect to the server."
            );

        }

    }


    // ==========================================
    // RESET FORM
    // ==========================================

    function resetForm() {

        document
            .getElementById("articleForm")
            .reset();


        document.getElementById(
            "articleId"
        ).value = "";


        document.getElementById(
            "author"
        ).value = "GLOBAL24";


        document.getElementById(
            "status"
        ).value = "Published";


        document.getElementById(
            "formTitle"
        ).textContent =
            "Create News Article";

    }


    // ==========================================
    // MESSAGE
    // ==========================================

    function showMessage(
        message,
        success
    ) {

        const box =
            document.getElementById(
                "formMessage"
            );


        box.textContent =
            message;


        box.className =
            success
                ? "message success-message"
                : "message error-message";


        box.style.display =
            "block";


        setTimeout(
            () => {
                box.style.display = "none";
            },
            4000
        );

    }


    // ==========================================
    // LOGOUT
    // ==========================================

    async function logout() {

        await fetch(
            "/api/logout",
            {
                method: "POST"
            }
        );


        window.location.href =
            "/login";

    }


    // ==========================================
    // ESCAPE HTML
    // ==========================================

    function escapeHTML(text) {

        if (
            text === null ||
            text === undefined
        ) {
            return "";
        }

        return String(text)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");

    }


    // ==========================================
    // START
    // ==========================================

    checkLogin();

</script>

</body>
</html>
