<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GLOBAL24 News</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>

    <div class="logo">
        <span>G</span>LOBAL24
    </div>

    <nav class="main-nav">

        <button onclick="loadCategory('WORLD')">
            WORLD
        </button>

        <button onclick="loadCategory('AFRICA')">
            AFRICA
        </button>

        <button onclick="loadCategory('ETHIOPIA')">
            ETHIOPIA
        </button>

        <button onclick="loadCategory('BUSINESS')">
            BUSINESS
        </button>

        <button onclick="loadCategory('TECHNOLOGY')">
            TECHNOLOGY
        </button>

        <button onclick="loadCategory('SPORT')">
            SPORT
        </button>

    </nav>

    <a class="admin" href="/admin">
        ADMIN
    </a>

</header>


<div class="ticker">

    <b>BREAKING</b>

    <span id="ticker-text">
        GLOBAL24 • Live international newsroom
    </span>

</div>


<main>

    {% if news %}

    <section class="hero">

        <img
            id="hero-image"
            src="{{ news[0].image }}"
            alt="{{ news[0].title }}"
        >

        <div>

            <label id="hero-category">
                {{ news[0].category }}
            </label>

            <h1 id="hero-title">
                {{ news[0].title }}
            </h1>

            <p id="hero-summary">
                {{ news[0].summary }}
            </p>

            <button
                id="hero-button"
                onclick="openStory()"
            >
                READ FULL STORY →
            </button>

        </div>

    </section>

    {% endif %}


    <h2 id="section-title">
        Latest News
    </h2>


    <div
        class="grid"
        id="news-grid"
    >

        {% for n in news %}

        <article>

            <img
                src="{{ n.image }}"
                alt="{{ n.title }}"
            >

            <small>
                {{ n.category }}
            </small>

            <h3>
                {{ n.title }}
            </h3>

            <p>
                {{ n.summary }}
            </p>

        </article>

        {% endfor %}

    </div>

</main>


<footer>

    GLOBAL24 NEWS · INTERNATIONAL NEWSROOM ·

    <a href="/admin">
        Newsroom Login
    </a>

</footer>


<script>

let currentStoryUrl = "";


// =====================================================
// LOAD A NEWS CATEGORY
// =====================================================

async function loadCategory(category) {

    const grid =
        document.getElementById("news-grid");

    const sectionTitle =
        document.getElementById("section-title");

    const ticker =
        document.getElementById("ticker-text");


    sectionTitle.textContent =
        category + " NEWS";


    ticker.textContent =
        "Loading " + category + " news...";


    grid.innerHTML = `
        <article>
            <h3>Loading ${category} news...</h3>
            <p>Please wait...</p>
        </article>
    `;


    try {

        const response = await fetch(
            "/api/news?category=" +
            encodeURIComponent(category)
        );


        if (!response.ok) {

            throw new Error(
                "API request failed: " +
                response.status
            );

        }


        const data =
            await response.json();


        grid.innerHTML = "";


        if (
            !data.stories ||
            data.stories.length === 0
        ) {

            grid.innerHTML = `
                <article>
                    <h3>No ${category} news found</h3>
                    <p>
                        No stories are currently
                        available for this section.
                    </p>
                </article>
            `;

            ticker.textContent =
                "GLOBAL24 • No stories available";

            return;
        }


        // Update the large cover story
        updateHero(data.stories[0]);


        // Create the news cards
        data.stories.forEach(
            function(story) {

                const article =
                    document.createElement("article");


                article.innerHTML = `

                    <img
                        src="${escapeHtml(story.image)}"
                        alt="${escapeHtml(story.title)}"
                    >

                    <small>
                        ${escapeHtml(story.category)}
                    </small>

                    <h3>
                        ${escapeHtml(story.title)}
                    </h3>

                    <p>
                        ${escapeHtml(
                            story.summary || ""
                        )}
                    </p>

                `;


                grid.appendChild(article);

            }
        );


        ticker.textContent =
            "GLOBAL24 • " +
            category +
            " • Live newsroom";


        // Move to the news section
        sectionTitle.scrollIntoView({
            behavior: "smooth"
        });

    }


    catch (error) {

        console.error(
            "GLOBAL24 NEWS ERROR:",
            error
        );


        grid.innerHTML = `
            <article>
                <h3>Unable to load news</h3>
                <p>
                    Please check the connection
                    to the news server.
                </p>
            </article>
        `;


        ticker.textContent =
            "GLOBAL24 • News connection error";

    }

}


// =====================================================
// UPDATE THE LARGE COVER STORY
// =====================================================

function updateHero(story) {

    const image =
        document.getElementById("hero-image");

    const category =
        document.getElementById("hero-category");

    const title =
        document.getElementById("hero-title");

    const summary =
        document.getElementById("hero-summary");


    if (image) {

        image.src =
            story.image;

        image.alt =
            story.title;

    }


    if (category) {

        category.textContent =
            story.category;

    }


    if (title) {

        title.textContent =
            story.title;

    }


    if (summary) {

        summary.textContent =
            story.summary || "";

    }


    currentStoryUrl =
        story.url || "";

}


// =====================================================
// OPEN ORIGINAL STORY
// =====================================================

function openStory() {

    if (currentStoryUrl) {

        window.open(
            currentStoryUrl,
            "_blank"
        );

    } else {

        alert(
            "The full story link is not available."
        );

    }

}


// =====================================================
// SECURITY: ESCAPE API CONTENT
// =====================================================

function escapeHtml(value) {

    if (!value) {
        return "";
    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

</script>


</body>

</html>
